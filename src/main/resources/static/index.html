<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joget XPDL Analyzer</title>
<style>body{font:16px system-ui;background:#f2f5fa;color:#18283d;max-width:1000px;margin:48px auto;padding:20px}section{background:white;padding:24px;border-radius:12px;margin:20px 0}button{background:#234bd2;color:white;border:0;padding:12px 22px;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}li{margin:10px 0}.ERROR{color:#a11818}.WARNING{color:#825900}input{margin:16px 0}h1{margin-bottom:8px}</style>
<h1>Joget workflow analyzer</h1><p>Inspect XPDL definitions used by Joget and Shark.</p><section><form id="form"><label for="file">Workflow XML / XPDL (up to 2 MB)</label><br><input id="file" name="file" type="file" accept=".xml,.xpdl" required><br><button>Analyze workflow</button></form><p>Static analysis only. Graph start/end candidates are inferred from transitions. Runtime state, scripts, and engine compatibility are not evaluated.</p></section><div id="result" aria-live="polite"></div>
<script>
const form=document.getElementById('form'),result=document.getElementById('result');
function node(tag,text,parent){let e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
function findings(items,parent){if(!items.length){node('p','No structural issues found by these checks.',parent);return}let list=node('ul','',parent);for(let f of items)node('li',`${f.severity} · ${f.code} · ${f.elementId}: ${f.message}`,list).className=f.severity}
form.addEventListener('submit',async e=>{e.preventDefault();result.replaceChildren();const button=form.querySelector('button');button.disabled=true;node('p','Analyzing…',result);try{const response=await fetch('/api/analyze',{method:'POST',body:new FormData(form)});const data=await response.json();if(!response.ok)throw Error(data.error||'Analysis failed');result.replaceChildren();let section=node('section','',result);node('h2',data.name||data.packageId||'Package',section);findings(data.findings,section);for(let p of data.processes){section=node('section','',result);node('h2',`${p.name||p.id} (${p.id})`,section);node('p',`${p.activities.length} activities · ${p.transitions.length} transitions · ${p.participants.length} participants`,section);node('p',`Start candidates: ${p.startCandidates.join(', ')||'none'} | End candidates: ${p.endCandidates.join(', ')||'none'}`,section);findings(p.findings,section);node('h3','Activity flow',section);for(let a of p.activities)node('p',`${a.id} · ${a.name} [${a.type}]${a.performer?' · performer: '+a.performer:''} → ${p.transitions.filter(t=>t.from===a.id).map(t=>t.to).join(', ')||'(no outgoing transitions)'}`,section)}let details=node('details','',result);node('summary','Full JSON report',details);node('pre',JSON.stringify(data,null,2),details)}catch(error){result.replaceChildren();node('p',error.message,result)}finally{button.disabled=false}});
</script></html>
